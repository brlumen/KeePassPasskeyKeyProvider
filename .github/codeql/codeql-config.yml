# Generic catch clauses are intentional: they are at the plugin's boundaries (UI handlers, the key provider,
# a worker thread), where any exception must become a message instead of crashing KeePass.
# Designer files are generated by the WinForms designer.
paths-ignore:
  - '**/*.Designer.cs'
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
  # The plugin is built on P/Invoke into webauthn.dll and user32.dll; signatures follow the Windows API
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
  - exclude:
      id: cs/too-many-ref-parameters
